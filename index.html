<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orbit: IT asset management - every device, who has it, and when it was last cleaned." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Orbit · IT Asset Management</title>
  </head>
  <body>
    <!-- Theme. Runs before the app so the right theme is on <body> before
         first paint. A theme someone chose (the header's sun/moon button)
         wins; otherwise it follows the computer's light or dark setting. -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : prefersLight ? 'light' : 'dark';
        document.body.classList.toggle('dark-mode', theme === 'dark');
        document.body.classList.toggle('light-mode', theme === 'light');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
