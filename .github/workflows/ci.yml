name: CI

# Runs the test suite on every push and pull request. The deploy workflow gates
# on its own fast test job, so a red build never reaches GitHub Pages.
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

# Read the code, nothing more: CI never needs to write to the repository.
permissions:
  contents: read

jobs:
  unit:
    name: Unit & component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Run Vitest (logic + components)
        run: npm test
      - name: Production build sanity check
        env:
          # Build only needs these to be present; values are inert for the bundle.
          VITE_SUPABASE_URL: https://stub.supabase.co
          VITE_SUPABASE_ANON_KEY: stub-anon-key
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        # playwright.config.js builds and previews the app, mocking Supabase in
        # the browser, so no live backend or secrets are required.
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release-notes:
    name: Release notes kept up to date
    # Backstop for the rule in CLAUDE.md: a change people can see ships with a
    # release-notes entry. Only warns - it never blocks a fix from going out.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that app changes came with release notes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous commit to compare with; skipping."
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          app_changes="$(echo "$changed" | grep -E '^(src/|index\.html$)' \
            | grep -vE '(\.test\.|__tests__/|^src/lib/releaseNotes\.js$)' || true)"
          if [ -n "$app_changes" ] && ! echo "$changed" | grep -qx 'src/lib/releaseNotes.js'; then
            echo "::warning title=Release notes not updated::The app changed but src/lib/releaseNotes.js did not. If people will notice the change, add an entry and bump the version in package.json."
            echo "Changed app files:"
            echo "$app_changes"
          else
            echo "Release notes are in step with the app."
          fi
